<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Shiori</title>
    <link rel="stylesheet" href="search.css" />
    <link rel="stylesheet" href="shiori-sidebar.css" />
  </head>
  <body class="sidebar">
    <form id="find" role="search">
      <input id="q" type="search" placeholder="Search your pages" aria-label="Search your pages"
        autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
    </form>
    <main>
      <section id="found" aria-labelledby="found-head" hidden>
        <h2 id="found-head">Your Pages</h2>
        <ol id="found-list" class="sidebar-pages"></ol>
        <p id="found-more" class="note" hidden><a id="found-all" href="search.html" target="_blank">All results in Shiori Search</a></p>
      </section>
      <section id="site" aria-labelledby="site-head">
        <h2 id="site-head">From This Site</h2>
        <ol id="site-list" class="sidebar-pages"></ol>
      </section>
      <p id="status" class="note" role="status" aria-live="polite"></p>
    </main>
    <script src="search-core.js"></script>
    <script src="shiori-pages.js"></script>
    <script src="shiori-sidebar.js"></script>
  </body>
</html>
