# CodeQL code scanning: the workflows, the C and C++ (the Haiku app, Shiori for Classic Macintosh), the
# JavaScript (the search page, the web app, the Safari extension's patches, Linux's modules), the Python (mac-bridge,
# the container's start-up, the build scripts) and the Swift packages. Swift is built on a macOS runner (see the swift
# job for why only the packages); the rest is read without a build.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, c-cpp, javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

  swift:
    name: analyze (swift)
    # CodeQL can't trace a build with Xcode 27 (github/codeql#22742: macOS 27 and Xcode 27 dropped the Intel binaries
    # its tracer needs), and the apps are built with Xcode 27. So until its new Swift extractor ships, this scans HisterKit
    # (the Hister and Kura clients) and ShioriAI's cloud clients with Xcode 26 on macOS 26; the Apple Intelligence
    # target needs the macOS 27 SDK.
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: swift
          build-mode: manual
      - name: Build the packages
        run: |
          swift build --package-path Packages/HisterKit
          swift build --package-path Packages/ShioriAI --target ShioriAI
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:swift
