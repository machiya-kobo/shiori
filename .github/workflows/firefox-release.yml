# Shiori for Firefox: on a version tag (v0.1.0 for MARKETING_VERSION
# 0.1.0), test, build, have Mozilla sign it as an unlisted add-on, and put
# the signed .xpi and updates.json on the tag's GitHub Release. Firefox
# finds updates at releases/latest/download/updates.json (the add-on's
# update_url), so every release from here on must carry an updates.json.
# Run by hand, it tests and builds only, and keeps the unsigned package as
# the run's artifact. docs/firefox.md has the rest.
#
# Secrets (Settings → Secrets and variables → Actions), from
# addons.mozilla.org → Developer Hub → Manage API Keys:
#   AMO_JWT_ISSUER, AMO_JWT_SECRET

name: Firefox release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firefox-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firefox:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # the release, on a tag
    env:
      # A push of a version tag only: a manual run on a tag ref builds and tests.
      SIGN: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Version
        id: version
        run: |
          version="$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)"
          [[ -n "$version" ]] || { echo "::error::MARKETING_VERSION not found in project.yml"; exit 1; }
          if [[ "$SIGN" == true && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::the tag $GITHUB_REF_NAME doesn't match MARKETING_VERSION $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tests
        run: node --test scripts/*.test.mjs

      - name: Build, lint and pack
        env:
          # AGPL section 13: the results page's About links the source.
          SHIORI_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          command -v rsync >/dev/null || sudo apt-get install -y rsync
          scripts/build-extension.sh --target firefox

      - name: Keep the unsigned package (run by hand)
        if: env.SIGN != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: shiori-firefox-${{ steps.version.outputs.version }}-unsigned
          path: build/shiori-firefox-${{ steps.version.outputs.version }}.zip

      # The built code is bundled (upstream's Vite build), so Mozilla asks
      # for readable source: this repository and the Hister submodule as
      # they are at the tag. docs/firefox.md tells a reviewer how to build.
      - name: Source for Mozilla's review
        if: env.SIGN == 'true'
        run: |
          git archive --format=tar --prefix=shiori/ -o build/source.tar HEAD
          git -C vendor/hister archive --format=tar --prefix=shiori/vendor/hister/ -o "$PWD/build/hister.tar" HEAD
          tar --concatenate --file=build/source.tar build/hister.tar
          gzip -9 build/source.tar

      - name: Sign (unlisted)
        if: env.SIGN == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          if [[ -z "$WEB_EXT_API_KEY" || -z "$WEB_EXT_API_SECRET" ]]; then
            echo "::error::AMO_JWT_ISSUER and AMO_JWT_SECRET must be set as Actions secrets to sign"
            exit 1
          fi
          npx --yes web-ext@10.7.0 sign --channel unlisted \
            --source-dir build/firefox --artifacts-dir build/signed \
            --upload-source-code build/source.tar.gz --approval-timeout 900000

      - name: Update manifest
        if: env.SIGN == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          signed=(build/signed/*.xpi)
          [[ ${#signed[@]} -eq 1 && -f "${signed[0]}" ]] || { echo "::error::expected one signed .xpi, found: ${signed[*]}"; exit 1; }
          name="shiori-firefox-$VERSION.xpi"
          mv -- "${signed[0]}" "build/$name"
          node scripts/firefox-updates.mjs build/firefox/manifest.json "build/$name" \
            "$REPO_URL/releases/download/$GITHUB_REF_NAME/$name" build/updates.json
          cat build/updates.json

      - name: Release
        if: env.SIGN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          files=("build/shiori-firefox-$VERSION.xpi" build/updates.json)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --verify-tag \
              --title "Shiori $VERSION" \
              --notes "Shiori for Firefox $VERSION, signed by Mozilla. Install: open shiori-firefox-$VERSION.xpi in Firefox (docs/firefox.md). Firefox keeps it up to date from here."
          fi
