# The tests that run anywhere: Node (search-core, the web pages, the Safari
# extension's scripts, Linux's modules), the Haiku app's portable C++ core,
# and Shiori for Classic Macintosh's portable C core and LAN bridge.
# The Swift apps and the Be API UI build on their own systems.
name: tests
# Branches only: a tag points at a commit main has already tested, and a tag
# checkout isn't one the version tests can read (mac-bridge-v0.1.1 isn't vX.Y.Z).
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  node-and-haiku-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Node tests (with the Haiku and Classic cores, built by the host's compilers)
        run: node --test scripts/*.test.mjs
