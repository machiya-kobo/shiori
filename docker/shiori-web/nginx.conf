# shiori-web's nginx: runs as a non-root user on a read-only root filesystem, so everything it writes is under /tmp
# (a tmpfs). The sites and routes are generated at start into /tmp/shiori/sites.conf (configure.py).
load_module /etc/nginx/modules/ngx_http_js_module.so;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    client_body_temp_path /tmp/nginx/client_body;
    proxy_temp_path /tmp/nginx/proxy;
    fastcgi_temp_path /tmp/nginx/fastcgi;
    uwsgi_temp_path /tmp/nginx/uwsgi;
    scgi_temp_path /tmp/nginx/scgi;
    # Basic Search (/basic, for browsers without JavaScript): web/basic.mjs on njs's QuickJS engine.
    js_engine qjs;
    js_path /opt/shiori/basic;
    js_import basic from basic-njs.mjs;
    js_fetch_timeout 15s;
    js_fetch_max_response_buffer_size 4m;
    include /tmp/shiori/sites.conf;
}
